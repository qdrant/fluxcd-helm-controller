name: e2e
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
      - "release/**"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Run tests
        run: make test
      - name: Check if working tree is dirty
        run: make verify
  kind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Test suite setup
        uses: fluxcd/gha-workflows/.github/actions/setup-kubernetes@ae56aad69f6bbd73bd78040bebdb3947e89ea52f # v0.17.0
        with:
          go-version: 1.27.x
      - name: Build container image
        run: |
          make docker-build IMG=test/helm-controller:latest \
            BUILD_PLATFORMS=linux/amd64 \
            BUILD_ARGS="--load"
      - name: Load test image
        run: kind load docker-image test/helm-controller:latest
      - name: Build source-controller image
        run: |
          git clone --branch v1.10.1-qdrant.1 --depth 1 https://github.com/qdrant/fluxcd-source-controller.git /tmp/source-controller
          cd /tmp/source-controller
          docker buildx build -t test/source-controller:latest --platform linux/amd64 --load .
      - name: Load source-controller image
        run: kind load docker-image test/source-controller:latest
      - name: Install CRDs
        run: |
          make install
          make download-crd-deps
          kubectl apply -f build/config/crd/bases/
      - name: Run default status test
        run: |
          kubectl apply -f config/testdata/status-defaults
          RESULT=$(kubectl get helmrelease status-defaults -o go-template={{.status}})
          EXPECTED='map[observedGeneration:-1]'
          if [ "${RESULT}" != "${EXPECTED}" ] ; then
            echo -e "${RESULT}\n\ndoes not equal\n\n${EXPECTED}"
            exit 1
          fi
      - name: Deploy controllers
        run: |
          make dev-deploy IMG=test/helm-controller:latest
          kubectl -n helm-system set image deployment/source-controller manager=test/source-controller:latest
          kubectl -n helm-system rollout status deploy/source-controller --timeout=2m
          kubectl -n helm-system rollout status deploy/helm-controller --timeout=1m
        env:
          KUBEBUILDER_ASSETS: ${{ github.workspace }}/kubebuilder/bin
      - name: Install sources
        run: |
          kubectl -n helm-system apply -f config/testdata/sources
      - parallel:
          - name: Run smoke tests
            run: |
              bash -e hack/ci/e2e/smoke.sh
          - name: Run SSA tests
            run: |
              bash -e hack/ci/e2e/ssa.sh
          - name: Run lifecycle tests
            run: |
              bash -e hack/ci/e2e/lifecycle.sh
          - name: Run advanced tests
            run: |
              bash -e hack/ci/e2e/advanced.sh
      - name: Logs
        if: always()
        continue-on-error: true
        run: |
          kubectl -n helm-system logs deploy/source-controller
          kubectl -n helm-system logs deploy/helm-controller
      - name: Debug failure
        if: failure()
        run: |
          kubectl -n helm-system get helmrepositories -oyaml || true
          kubectl -n helm-system get helmcharts -oyaml || true
          kubectl -n helm-system get helmreleases -oyaml || true
          kubectl -n helm-system get all
          helm ls -n helm-system --all
  kubeconfig-remote:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for reading the repository code.
    steps:
      - name: Test suite setup
        # The custom kind config sets the ServiceAccount issuer URL used by the
        # remote cluster's OIDC authenticator.
        uses: fluxcd/gha-workflows/.github/actions/setup-kubernetes@ae56aad69f6bbd73bd78040bebdb3947e89ea52f # v0.17.0
        with:
          go-version: 1.27.x
          kind-config: hack/ci/kubeconfig-primary-kind.yaml
      - name: Build container image
        run: |
          make docker-build IMG=test/helm-controller:latest \
            BUILD_PLATFORMS=linux/amd64 \
            BUILD_ARGS="--load"
      # Fork: run the source-controller fork, which serves the cd.qdrant.io
      # sources, instead of upstream's, as in the kind job.
      - name: Build source-controller image
        run: |
          git clone --branch v1.10.1-qdrant.1 --depth 1 https://github.com/qdrant/fluxcd-source-controller.git /tmp/source-controller
          docker buildx build -t test/source-controller:latest --platform linux/amd64 --load /tmp/source-controller
          kind load docker-image test/source-controller:latest
      - name: Use the source-controller fork
        run: |
          make download-crd-deps
          kubectl apply -f build/config/crd/bases/
          cd config/default && kustomize edit set image fluxcd/source-controller=test/source-controller:latest
      - name: Run remote kubeconfig e2e
        # Reuses the "kind" cluster the setup action created and adds a second one.
        run: hack/ci/kubeconfig-e2e.sh
        env:
          IMG: test/helm-controller:latest
