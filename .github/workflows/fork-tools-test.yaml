name: fork-tools-test

# Tests and lints the fork's own tooling, tools/fork-sync.

on:
  pull_request:
    paths:
      - tools/**
      - .github/workflows/fork-tools-test.yaml
  push:
    branches: [ main ]
    paths:
      - tools/**
      - .github/workflows/fork-tools-test.yaml

permissions: {}

jobs:
  fork-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/fork-sync/go.mod
          cache-dependency-path: tools/fork-sync/go.sum

      - name: Test
        run: go -C tools/fork-sync test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4 # same as qdrant-cloud-agent
          working-directory: tools/fork-sync
