name: conflict-markers

# Fails while a merge conflict is unresolved: conflict markers in a file, or the
# .sync-upstream-conflicts list that the sync-upstream workflow commits with a
# conflicted merge. Neither is visible to the other checks when the conflict is
# in a file no test builds, or when it leaves no markers at all (a file deleted
# upstream and modified here).

on:
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail on unresolved conflicts
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) '; then
            echo "::error::Unresolved merge conflict markers found, see the lines above."
            exit 1
          fi
          if [ -e .sync-upstream-conflicts ]; then
            echo "::error::The merge conflicts listed in .sync-upstream-conflicts are not resolved. Resolve them, then delete that file."
            exit 1
          fi
